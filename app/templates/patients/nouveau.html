{% extends "base.html" %}
{% block title %}Nouveau patient – CliniCare{% endblock %}
{% block content %}
<h1>Nouveau patient</h1>
<form class="card" method="post" novalidate style="max-width:640px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="grid2">
    <div><label for="nom">Nom</label><input id="nom" name="nom" value="{{ f.get('nom','') }}" required autofocus></div>
    <div><label for="prenom">Prénom</label><input id="prenom" name="prenom" value="{{ f.get('prenom','') }}" required></div>
    <div><label for="dn">Date de naissance</label><input id="dn" name="date_naissance" type="date" value="{{ f.get('date_naissance','') }}" required></div>
    <div><label for="sexe">Sexe</label><select id="sexe" name="sexe" required><option value="">Choisir</option>
      <option value="F" {{ 'selected' if f.get('sexe')=='F' }}>Féminin</option><option value="M" {{ 'selected' if f.get('sexe')=='M' }}>Masculin</option></select></div>
  </div>
  <label for="tel">Téléphone</label><input id="tel" name="telephone" type="tel" value="{{ f.get('telephone','') }}" required>
  <label for="adr">Adresse</label><input id="adr" name="adresse" value="{{ f.get('adresse','') }}">
  <p><button type="submit">Créer le dossier</button> <a class="btn alt" href="{{ url_for('patients.liste') }}">Annuler</a></p>
</form>
{% endblock %}
