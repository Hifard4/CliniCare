{% extends "base.html" %}
{% block title %}Connexion – CliniCare{% endblock %}
{% block auth %}
<form class="card" method="post" novalidate>
  <h1>Connexion</h1>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="email">Adresse e-mail</label>
  <input id="email" name="email" type="email" autocomplete="username" required autofocus>
  <label for="password">Mot de passe</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <p><button type="submit">Se connecter</button></p>
  <p class="muted">Mot de passe oublié ? Contactez l'accueil de la clinique pour le réinitialiser.</p>
  <p>Nouveau patient ? <a href="{{ url_for('auth.register', next=request.args.get('next')) }}">Créer mon compte</a></p>
</form>
{% endblock %}
