{% extends "base.html" %}
{% block title %}Créer mon compte – CliniCare{% endblock %}
{% block auth %}
<form class="card" method="post" novalidate>
  <h1>Créer mon compte patient</h1>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="grid2">
    <div><label for="prenom">Prénom</label><input id="prenom" name="prenom" value="{{ f.get('prenom','') }}" required></div>
    <div><label for="nom">Nom</label><input id="nom" name="nom" value="{{ f.get('nom','') }}" required></div>
    <div><label for="dn">Date de naissance</label><input id="dn" name="date_naissance" type="date" value="{{ f.get('date_naissance','') }}" required></div>
    <div><label for="sexe">Sexe</label>
      <select id="sexe" name="sexe" required><option value="">Choisir</option>
        <option value="F" {{ 'selected' if f.get('sexe')=='F' }}>Féminin</option><option value="M" {{ 'selected' if f.get('sexe')=='M' }}>Masculin</option></select></div>
  </div>
  <label for="tel">Téléphone</label><input id="tel" name="telephone" type="tel" value="{{ f.get('telephone','') }}" required>
  <label for="email">Adresse e-mail</label><input id="email" name="email" type="email" value="{{ f.get('email','') }}" required>
  <label for="pwd">Mot de passe (8 caractères minimum)</label><input id="pwd" name="password" type="password" autocomplete="new-password" required>
  <label for="confirm">Confirmer le mot de passe</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
  <p><button type="submit">Créer mon compte</button></p>
  <p>Déjà inscrit ? <a href="{{ url_for('auth.login', next=request.args.get('next')) }}">Se connecter</a></p>
</form>
{% endblock %}
